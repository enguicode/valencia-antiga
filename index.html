<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f0e2c6">
  <title>València Antiga · el Turia hacia 1700</title>
  <meta name="description" content="Paseo interactivo en 3D por el Turia y la València amurallada de hacia 1700: la muralla, sus puertas, los cinco puentes históricos y el perfil de la ciudad, vistos desde una barca.">
  <meta property="og:title" content="València Antiga">
  <meta property="og:description" content="Baja en barca por el viejo cauce del Turia y mira la València amurallada de hacia 1700.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235a9a96'/%3E%3Cpath d='M16 5v17M17 6l8 14h-8z' fill='%23f3e9d2' stroke='%237a5230' stroke-width='1.5'/%3E%3Cpath d='M6 22h20l-3 5H9z' fill='%237a5230'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #2e2418;
      --parchment: rgba(244, 233, 210, 0.82);
      --rule: rgba(46, 36, 24, 0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #f0e2c6;
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      -webkit-user-select: none;
      user-select: none;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .panel {
      position: fixed;
      padding: 10px 14px;
      background: var(--parchment);
      border: 1px solid var(--rule);
      border-radius: 3px;
      pointer-events: none;
    }

    /* The top of the screen stays nearly empty: a one-line tally on the left
       and a small map on the right. */
    #status {
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      padding: 6px 10px;
      font: inherit;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    #status svg {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* The logbook: every point of interest, the ones not yet found as blanks. */
    #journal {
      width: min(480px, calc(100% - 28px));
      max-height: calc(100% - 40px);
      padding: 20px 22px;
      color: var(--ink);
      font: inherit;
      line-height: 1.45;
      background: #f4e9d2;
      border: 1px solid var(--rule);
      border-radius: 4px;
      -webkit-user-select: text;
      user-select: text;
    }

    #journal::backdrop { background: rgba(46, 36, 24, 0.5); }

    #journal h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    #journal .tally {
      margin: 2px 0 12px;
      font-size: 0.85rem;
      font-style: italic;
      opacity: 0.8;
    }

    #journal ol {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #journal li {
      padding: 9px 12px;
      background: rgba(255, 250, 240, 0.6);
      border: 1px solid var(--rule);
      border-radius: 3px;
    }

    #journal li h3 {
      margin: 0 0 3px;
      font-size: 0.98rem;
    }

    #journal li p {
      margin: 0 0 4px;
      font-size: 0.86rem;
    }

    #journal li a {
      font-size: 0.76rem;
      color: inherit;
      opacity: 0.8;
    }

    #journal li { position: relative; }

    #journal li h3 { padding-right: 40px; }

    #journal .view {
      position: absolute;
      top: 6px;
      right: 6px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--rule);
      border-radius: 3px;
      cursor: pointer;
    }

    #journal .view svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #journal li.unknown {
      color: rgba(46, 36, 24, 0.55);
      background: repeating-linear-gradient(135deg, rgba(46, 36, 24, 0.05) 0 8px, transparent 8px 16px);
      border-style: dashed;
    }

    #journal li.unknown h3 { letter-spacing: 0.25em; }

    #journal .close {
      display: block;
      margin: 14px 0 0 auto;
      padding: 8px 16px;
      font: inherit;
      color: #f4e9d2;
      background: var(--ink);
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }

    #help {
      left: 50%;
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 52px);
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      font-size: 0.9rem;
      text-align: center;
      transition: opacity 0.8s ease;
    }

    #help.dismissed { opacity: 0; }

    #tour-notice {
      left: 50%;
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 52px);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      font-size: 0.9rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #tour-notice.visible { opacity: 1; }

    #help .touch { display: none; }

    @media (pointer: coarse) {
      #help .keys { display: none; }
      #help .touch { display: inline; }
    }

    kbd {
      font: inherit;
      padding: 0 5px;
      border: 1px solid var(--rule);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.45);
    }

    #minimap {
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      width: 84px;
      height: 84px;
      padding: 0;
      cursor: zoom-in;
      pointer-events: auto;
    }

    /* Tapped, the map opens out over the top of the screen. */
    #minimap.large {
      z-index: 2;
      width: min(340px, calc(100vw - 20px), calc(100vh - 140px));
      height: min(340px, calc(100vw - 20px), calc(100vh - 140px));
      background: rgba(244, 233, 210, 0.95);
      cursor: zoom-out;
    }

    /* History card: only while the boat is in, or just past, a ring. */
    #card {
      top: calc(max(10px, env(safe-area-inset-top)) + 40px);
      left: max(10px, env(safe-area-inset-left));
      width: min(340px, calc(100% - 114px));
      padding: 9px 12px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #card.visible {
      opacity: 1;
      transform: none;
    }

    #card h2 {
      margin: 0 0 3px;
      font-size: 1rem;
      font-weight: 600;
    }

    #card p {
      margin: 0 0 5px;
      font-size: 0.84rem;
      line-height: 1.35;
    }

    #card a,
    #card .tally {
      font-size: 0.74rem;
      opacity: 0.8;
    }

    #card a { color: inherit; }

    #card.visible a { pointer-events: auto; }

    #card .tally {
      float: right;
      margin: 0;
      font-style: italic;
    }

    /* Arrow at the edge of the screen towards the nearest point still to find. */
    #pointer {
      position: fixed;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transform: translate(-50%, -50%);
      color: #2e2418;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    body.started #pointer.visible { display: flex; }

    #pointer svg {
      width: 34px;
      height: 34px;
      filter: drop-shadow(0 1px 2px rgba(46, 36, 24, 0.5));
    }

    #pointer span {
      padding: 1px 6px;
      background: var(--parchment);
      border: 1px solid var(--rule);
      border-radius: 3px;
    }

    #reset-found {
      padding: 8px 16px;
      font: inherit;
      color: #f4e9d2;
      background: var(--ink);
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }

    /* The menu: a button under the map that unfolds a column of actions,
       each with its icon and its name. */
    #menu-toggle,
    #controls button {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 40px;
      padding: 0 12px 0 10px;
      font: inherit;
      font-size: 0.88rem;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--rule);
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }

    #menu-toggle {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 92px);
      right: max(10px, env(safe-area-inset-right));
      justify-content: center;
      width: 84px;
      height: 34px;
      padding: 0;
    }

    #controls {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 132px);
      right: max(10px, env(safe-area-inset-right));
      display: none;
      flex-direction: column;
      gap: 6px;
      min-width: 190px;
    }

    body.menu-open #controls { display: flex; }

    body.menu-open #menu-toggle,
    #controls button.active {
      background: var(--ink);
      color: #f4e9d2;
    }

    #menu-toggle svg,
    #controls svg {
      flex: none;
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #controls .glyph {
      flex: none;
      width: 22px;
      font-size: 1.05rem;
      text-align: center;
    }

    /* Quick actions: small round buttons along the bottom edge. The hour and
       the sound sit in the middle, between the two sticks on a touch screen;
       the guided tour sits by the stick that sails the boat. */
    .quick {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      color: var(--ink);
      background: rgba(244, 233, 210, 0.88);
      border: 1px solid var(--rule);
      border-radius: 50%;
      cursor: pointer;
    }

    .quick.active {
      background: var(--ink);
      color: #f4e9d2;
    }

    .quick svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quick .label { display: none; }

    #quick {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    #tour {
      position: fixed;
      left: max(14px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
    }

    /* Above the stick's left corner, well clear of its ring. */
    body.touch #tour {
      left: max(4px, env(safe-area-inset-left) - 10px);
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 100px + 5vh);
    }

    /* Nothing of the cockpit shows until the visitor sets off. */
    body:not(.started) .panel,
    body:not(.started) .quick,
    body:not(.started) #controls,
    body:not(.started) #menu-toggle { visibility: hidden; }

    body.started #intro { display: none; }

    #intro {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at center, rgba(46, 36, 24, 0.15), rgba(46, 36, 24, 0.55));
    }

    #intro .sheet {
      width: min(460px, 100%);
      padding: 28px 28px 22px;
      background: rgba(244, 233, 210, 0.93);
      border: 1px solid var(--rule);
      border-radius: 4px;
      text-align: center;
    }

    #intro .eyebrow {
      margin: 0;
      font-size: 0.85rem;
      font-style: italic;
      letter-spacing: 0.06em;
      opacity: 0.8;
    }

    #intro h1 {
      margin: 4px 0 12px;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.1;
    }

    #intro p {
      margin: 0 0 14px;
      line-height: 1.5;
    }

    #intro .choice {
      display: inline-flex;
      margin: 0 3px 12px;
      border: 1px solid var(--rule);
      border-radius: 3px;
      overflow: hidden;
    }

    #intro .choice button {
      padding: 7px 14px;
      font: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-left: 1px solid var(--rule);
      cursor: pointer;
    }

    #intro .choice button:first-child { border-left: 0; }

    #intro .choice button[aria-pressed="true"] {
      background: var(--ink);
      color: #f4e9d2;
    }

    /* The two ways of setting off always share one row. */
    #intro .actions {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    #intro .actions button {
      flex: 1 1 0;
      min-width: 0;
      padding: 11px 8px;
      font: inherit;
      font-size: clamp(0.84rem, 3.6vw, 1rem);
      white-space: nowrap;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--ink);
      border-radius: 3px;
      cursor: pointer;
    }

    #intro .actions button:first-child {
      background: var(--ink);
      color: #f4e9d2;
    }

    #intro .actions button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    /* The three small links stay on one line, shrinking a little if they must. */
    #intro .links {
      font-size: clamp(0.72rem, 3.3vw, 0.95rem);
      white-space: nowrap;
    }

    #intro .note {
      margin: 0;
      font-size: 0.8rem;
      opacity: 0.75;
    }

    .link {
      padding: 0;
      font: inherit;
      color: inherit;
      text-decoration: underline;
      background: none;
      border: 0;
      cursor: pointer;
    }

    #info {
      width: min(560px, calc(100% - 28px));
      max-height: calc(100% - 40px);
      padding: 22px 24px;
      color: var(--ink);
      font: inherit;
      line-height: 1.5;
      background: #f4e9d2;
      border: 1px solid var(--rule);
      border-radius: 4px;
      -webkit-user-select: text;
      user-select: text;
    }

    #info::backdrop { background: rgba(46, 36, 24, 0.55); }

    #info h2 {
      margin: 18px 0 6px;
      font-size: 1.1rem;
    }

    #info h2:first-of-type { margin-top: 0; }

    #info ul {
      margin: 0 0 8px;
      padding-left: 20px;
    }

    #info li { margin-bottom: 4px; }

    #info a { color: inherit; }

    #info select {
      padding: 4px 6px;
      font: inherit;
      color: var(--ink);
      background: #fffaf0;
      border: 1px solid var(--rule);
      border-radius: 3px;
    }

    #info .close {
      display: block;
      margin: 18px 0 0 auto;
      padding: 8px 16px;
      font: inherit;
      color: #f4e9d2;
      background: var(--ink);
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }

    #debug {
      top: calc(max(10px, env(safe-area-inset-top)) + 44px);
      left: max(14px, env(safe-area-inset-left));
      font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace;
    }

    /* Touch layout: a stick to sail at the bottom left and one to look around
       at the bottom right. */
    .stick {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom));
      display: none;
      width: 112px;
      height: 112px;
      border: 2px solid rgba(244, 233, 210, 0.55);
      border-radius: 50%;
      background: rgba(46, 36, 24, 0.16);
      touch-action: none;
    }

    #move-stick { left: max(14px, env(safe-area-inset-left)); }

    #look-stick { right: max(14px, env(safe-area-inset-right)); }

    body.touch.started .stick { display: block; }

    .stick.held { background: rgba(46, 36, 24, 0.26); }

    .stick .knob {
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin: -25px 0 0 -25px;
      color: var(--ink);
      background: rgba(244, 233, 210, 0.88);
      border: 1px solid var(--rule);
      border-radius: 50%;
      pointer-events: none;
    }

    .stick svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Hints sit above the sticks instead of between them. */
    body.touch #help,
    body.touch #tour-notice {
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 126px);
      max-width: calc(100% - 120px);
    }

    body.touch #help .keys { display: none; }

    body.touch #help .touch { display: inline; }

    #joystick {
      position: fixed;
      width: 112px;
      height: 112px;
      margin: -56px 0 0 -56px;
      border: 2px solid rgba(244, 233, 210, 0.7);
      border-radius: 50%;
      background: rgba(46, 36, 24, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    #joystick.active { opacity: 1; }

    #joystick .knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border-radius: 50%;
      background: rgba(244, 233, 210, 0.85);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <button id="status" class="panel" type="button" title="Ver los puntos de interés" data-i18n-label="status.title">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span><strong id="found">0 de 15</strong> <span data-i18n="status.points">puntos</span> · <span id="distance">0</span> <span data-i18n="status.of">m de</span> <span id="total">…</span></span>
  </button>

  <canvas id="minimap" class="panel"></canvas>

  <article id="card" class="panel">
    <h2></h2>
    <p class="text"></p>
    <a target="_blank" rel="noopener" data-i18n="card.source">Fuente: Wikipedia</a>
    <span class="tally"></span>
  </article>

  <div id="help" class="panel">
    <span class="keys" data-i18n-html="hint.keys"></span>
    <span class="touch" data-i18n="hint.touch">Mando izquierdo: la barca. Mando derecho, el del ojo: la cámara</span>
  </div>

  <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="controls">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span data-i18n="menu">Menú</span>
  </button>

  <div id="controls">
    <button class="reset-found" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4.5v4.2h4.2"/></svg>
      <span class="label" data-i18n="reset.short">Reiniciar puntos</span>
    </button>
    <!-- gear outline adapted from Feather Icons (MIT) -->
    <button type="button" data-open="settings-section">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(1.8 1.8) scale(0.85)"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></g></svg>
      <span class="label" data-i18n="menu.settings">Ajustes</span>
    </button>
    <button type="button" data-open="help-section">
      <span class="glyph">?</span>
      <span class="label" data-i18n="menu.help">Ayuda y créditos</span>
    </button>
  </div>

  <div id="tour-notice" class="panel" role="status" data-i18n="tour.notice"></div>

  <div id="pointer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5l16 7-16 7 4-7z" fill="#f4e9d2" stroke="#5a4a36" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span></span>
  </div>

  <dialog id="journal">
    <h2 data-i18n="journal.title">Puntos de interés</h2>
    <p class="tally"></p>
    <ol></ol>
    <button id="close-journal" class="close" type="button" data-i18n="journal.close">Seguir navegando</button>
  </dialog>

  <div id="debug" class="panel" hidden></div>

  <section id="intro">
    <div class="sheet">
      <p class="eyebrow" data-i18n="intro.eyebrow">El Turia hacia 1700</p>
      <h1>València Antiga</h1>
      <p data-i18n="intro.lead"></p>
      <div class="choice languages" role="group" aria-label="Idioma" data-i18n-label="intro.language">
        <button type="button" data-language="es" lang="es">Castellano</button>
        <button type="button" data-language="ca" lang="ca-valencia">Valencià</button>
        <button type="button" data-language="en" lang="en">English</button>
      </div>
      <div class="choice moments" role="group" aria-label="Momento del día" data-i18n-label="intro.moment">
        <button type="button" data-hour="18" data-i18n="sky.day">Día</button>
        <button type="button" data-hour="20" data-i18n="sky.dusk">Atardecer</button>
        <button type="button" data-hour="23.5" data-i18n="sky.night">Noche</button>
      </div>
      <div class="actions">
        <button id="start" type="button" disabled data-i18n="start.loading">Cargando…</button>
        <button id="start-tour" type="button" disabled data-i18n="tour">Recorrido guiado</button>
      </div>
      <p class="links"><button class="link" type="button" data-open="help-section" data-i18n="intro.controls">Controles</button> · <button class="link" type="button" data-open="credits-section" data-i18n="intro.credits">Créditos y fuentes</button> · <button class="link reset-found" type="button" data-i18n="reset.short">Reiniciar puntos</button></p>
      <p class="note" data-i18n="intro.note"></p>
    </div>
  </section>

  <dialog id="info">
    <h2 id="help-section" data-i18n="help.title">Controles</h2>
    <ul>
      <li data-i18n-html="help.keyboard"></li>
      <li data-i18n-html="help.mouse"></li>
      <li data-i18n-html="help.touch"></li>
      <li data-i18n-html="help.points"></li>
      <li data-i18n-html="help.bridges"></li>
      <li data-i18n-html="help.menu"></li>
      <li data-i18n-html="help.tour"></li>
    </ul>
    <h2 id="settings-section" data-i18n="settings.title">Ajustes</h2>
    <p><label><span data-i18n="settings.language">Idioma:</span>
      <select id="language">
        <option value="es" lang="es">Castellano</option>
        <option value="ca" lang="ca-valencia">Valencià</option>
        <option value="en" lang="en">English</option>
      </select>
    </label></p>
    <p data-i18n="settings.sun"></p>
    <p><label><span data-i18n="settings.hour">Hora del día:</span>
      <select id="hour">
        <option value="6.6" data-i18n="hour.dawn">Alba</option>
        <option value="10" data-i18n="hour.morning">Mañana</option>
        <option value="13" data-i18n="hour.noon">Mediodía</option>
        <option value="18" data-i18n="hour.afternoon">Tarde</option>
        <option value="20" data-i18n="hour.sunset">Ocaso</option>
        <option value="23.5" data-i18n="hour.night">Noche</option>
      </select>
    </label></p>
    <p><label><span data-i18n="settings.boat">Barca:</span>
      <select id="boat-type">
        <option value="albufera" data-i18n="boat.albufera">De la Albufera, con percha</option>
        <option value="lateen" data-i18n="boat.lateen">De río, con timonel sentado</option>
      </select>
    </label></p>
    <p><button id="reset-found" class="reset-found" type="button" data-i18n="settings.reset">Volver a empezar los puntos de interés</button></p>
    <p><label><span data-i18n="settings.quality">Calidad gráfica:</span>
      <select id="quality">
        <option value="auto" data-i18n="quality.auto">Automática</option>
        <option value="high" data-i18n="quality.high">Alta</option>
        <option value="medium" data-i18n="quality.medium">Media</option>
        <option value="low" data-i18n="quality.low">Baja</option>
      </select>
    </label></p>

    <h2 id="credits-section" data-i18n="credits.title">Créditos y fuentes</h2>
    <ul>
      <li data-i18n-html="credits.layout"></li>
      <li data-i18n-html="credits.cards"></li>
      <li data-i18n-html="credits.engine"></li>
      <li data-i18n-html="credits.sound"></li>
      <li data-i18n-html="credits.code"></li>
    </ul>

    <h2 data-i18n="reliable.title">Qué es fiable y qué no</h2>
    <ul>
      <li data-i18n-html="reliable.yes"></li>
      <li data-i18n-html="reliable.roughly"></li>
      <li data-i18n-html="reliable.no"></li>
    </ul>
    <p data-i18n="version">Versión 1.0.</p>
    <button id="close-info" class="close" type="button" data-i18n="close">Cerrar</button>
  </dialog>

  <script>
    // If the scene cannot start, say so on the start screen instead of
    // leaving it on "Cargando…" for ever.
    const reportFailure = () => {
      if (window.__valenciaReady) return;
      const language = document.documentElement.lang.slice(0, 2);
      const messages = {
        es: ['No se ha podido cargar', 'Hace falta un navegador con gráficos 3D (WebGL) y conexión para descargar la escena.'],
        ca: ["No s'ha pogut carregar", "Cal un navegador amb gràfics 3D (WebGL) i connexió per a descarregar l'escena."],
        en: ['Could not load', 'You need a browser with 3D graphics (WebGL) and a connection to download the scene.'],
      };
      const [title, note] = messages[language] ?? messages.es;
      const start = document.getElementById('start');
      start.removeAttribute('data-i18n');
      start.textContent = title;
      const hint = document.querySelector('#intro .note');
      hint.removeAttribute('data-i18n');
      hint.textContent = note;
    };
    addEventListener('error', reportFailure, true);
    addEventListener('unhandledrejection', reportFailure);
  </script>

  <div id="joystick"><div class="knob"></div></div>

  <div id="move-stick" class="stick" role="img" aria-label="Mover la barca" data-i18n-label="stick.move">
    <div class="knob">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
    </div>
  </div>
  <div id="look-stick" class="stick" role="img" aria-label="Mirar alrededor" data-i18n-label="stick.look">
    <div class="knob">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
  </div>

  <!-- Quick actions within reach of the thumbs: icon only, the name is in the label. -->
  <button id="tour" class="quick" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.8 8.2l-2.2 5.4-5.4 2.2 2.2-5.4z"/></svg>
    <span class="label" data-i18n="tour">Recorrido guiado</span>
  </button>
  <div id="quick">
    <button id="sky" class="quick" type="button"></button>
    <button id="sound" class="quick" type="button"></button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
